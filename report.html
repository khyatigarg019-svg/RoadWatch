<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RoadWatch</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container"><a class="brand" href="index.html">Road<span>Watch</span></a><nav class="links"><a href="index.html">Home</a><a href="report.html">Report</a><a href="my-reports.html">My Reports</a><a href="map.html">Map</a><a href="admin.html">Admin</a><a href="login.html">Login</a></nav></div></header><div class="head"><div class="container"><h1>Report a Pothole</h1><p>Upload a road image and provide location information.</p></div></div><main class="container"><form class="card form" id="form"><label>Road image *</label><input id="photo" type="file" accept="image/*" required><img id="preview" class="preview" hidden><label>Description</label><textarea id="desc" placeholder="Describe the pothole or nearby landmark"></textarea><label>Location / landmark *</label><input id="place" required placeholder="e.g. Near college main gate, Meerut"><div class="two"><div><label>Latitude (optional)</label><input id="lat" type="number" step="any"></div><div><label>Longitude (optional)</label><input id="lng" type="number" step="any"></div></div><button type="button" class="btn light" id="gps" style="margin:12px 0">Use my current location</button><div class="notice">Prototype note: connect a real YOLO model to perform actual AI detection.</div><button class="btn orange">Submit Report</button></form></main><script>let img='';photo.onchange=()=>{let f=photo.files[0];if(!f)return;if(f.size>3000000){alert('Choose an image below 3 MB');photo.value='';return}let rd=new FileReader();rd.onload=()=>{img=rd.result;preview.src=img;preview.hidden=false};rd.readAsDataURL(f)};gps.onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lng.value=p.coords.longitude},()=>alert('Location permission unavailable'));form.onsubmit=e=>{e.preventDefault();if(!img)return alert('Choose an image');let all=reports();let r={id:'RW'+Date.now().toString().slice(-7),user:user(),image:img,description:desc.value,location:place.value,lat:lat.value,lng:lng.value,date:new Date().toLocaleString(),severity:'Needs review',status:'Reported'};all.unshift(r);save(all);sessionStorage.setItem('lastReport',r.id);location.href='results.html'}</script><footer class="footer">© 2026 RoadWatch | AI-assisted pothole reporting prototype</footer><script src="js/app.js"></script></body></html>
