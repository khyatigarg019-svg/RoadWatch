<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RoadWatch</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container"><a class="brand" href="index.html">Road<span>Watch</span></a><nav class="links"><a href="index.html">Home</a><a href="report.html">Report</a><a href="my-reports.html">My Reports</a><a href="map.html">Map</a><a href="admin.html">Admin</a><a href="login.html">Login</a></nav></div></header><div class="head"><div class="container"><h1>Admin Dashboard</h1><p>Overview of all submitted reports.</p></div></div><main class="container"><div class="notice">Demo admin page. Add secure admin authentication before deployment.</div><div class="stats" id="stats"></div><div class="card"><h2>Recent Reports</h2><div id="recent"></div><a class="btn" href="manage-reports.html">Manage Reports</a></div></main><script>let a=reports();let n=s=>a.filter(r=>r.status===s).length;stats.innerHTML=[['Total',a.length],['Reported',n('Reported')],['Verified',n('Verified')],['Resolved',n('Resolved')]].map(x=>`<div class="stat"><b>${x[1]}</b>${x[0]}</div>`).join('');recent.innerHTML=a.length?'<div class="tablewrap"><table><tr><th>ID</th><th>Location</th><th>Status</th></tr>'+a.slice(0,5).map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.location)}</td><td>${esc(r.status)}</td></tr>`).join('')+'</table></div>':'<p class="empty">No reports yet.</p>'</script><footer class="footer">© 2026 RoadWatch | AI-assisted pothole reporting prototype</footer><script src="js/app.js"></script></body></html>
