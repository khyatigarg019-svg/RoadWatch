<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>RoadWatch</title><link rel="stylesheet" href="css/style.css"></head><body><header class="nav"><div class="container"><a class="brand" href="index.html">Road<span>Watch</span></a><nav class="links"><a href="index.html">Home</a><a href="report.html">Report</a><a href="my-reports.html">My Reports</a><a href="map.html">Map</a><a href="admin.html">Admin</a><a href="login.html">Login</a></nav></div></header><div class="head"><div class="container"><h1>My Reports</h1><p>Reports submitted from this browser.</p></div></div><main class="container"><p>Signed in as: <b id="who"></b></p><div id="list"></div><a class="btn orange" href="report.html">+ New Report</a></main><script>who.textContent=user();let mine=reports().filter(r=>r.user===user());list.innerHTML=mine.length?'<div class="tablewrap"><table><tr><th>ID</th><th>Location</th><th>Date</th><th>Severity</th><th>Status</th></tr>'+mine.map(r=>`<tr><td>${esc(r.id)}</td><td>${esc(r.location)}</td><td>${esc(r.date)}</td><td>${esc(r.severity)}</td><td><span class="badge">${esc(r.status)}</span></td></tr>`).join('')+'</table></div>':'<div class="card empty">No reports submitted yet.</div>'</script><footer class="footer">© 2026 RoadWatch | AI-assisted pothole reporting prototype</footer><script src="js/app.js"></script></body></html>
