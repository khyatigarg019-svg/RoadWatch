<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RoadWatch</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="nav">
        <div class="container"><a class="brand" href="index.html">Road<span>Watch</span></a>
            <nav class="links"><a href="index.html">Home</a><a href="report.html">Report</a><a href="my-reports.html">My
                    Reports</a><a href="map.html">Map</a><a href="admin.html">Admin</a><a href="login.html">Login</a>
            </nav>
        </div>
    </header>
    <div class="head">
        <div class="container">
            <h1>Login / Sign Up</h1>
            <p>Enter a display name to use this browser demo.</p>
        </div>
    </div>
    <main class="container">
        <form class="card form" id="auth"><label>Name</label><input id="name" required
                placeholder="Your name"><label>Email</label><input id="email" type="email" required
                placeholder="you@example.com"><label>Password</label><input id="pass" type="password" required
                minlength="4"><button class="btn" style="margin-top:18px">Continue</button>
            <p id="msg" class="notice"></p>
            <p class="small muted">Prototype only: this page does not provide secure authentication or store passwords.
            </p>
        </form>
    </main>
    <script>document.getElementById('auth').onsubmit = e => { e.preventDefault(); localStorage.setItem('roadwatch_user', document.getElementById('name').value); document.getElementById('msg').textContent = 'Demo login successful. Opening report page...'; setTimeout(() => location.href = 'report.html', 700) }</script>
    <footer class="footer">© 2026 RoadWatch | AI-assisted pothole reporting prototype</footer>
    <script src="js/app.js"></script>
</body>

</html>
